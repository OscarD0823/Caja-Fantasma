"$schema" = "schemas/schema.json"

[default]
description = "Permite comprobar actualizaciones y mantener la sincronización local protegida en Android."
permissions = [
  "allow-check",
  "allow-install",
  "allow-start-background-sync",
  "allow-update-background-sync",
  "allow-read-background-sync",
  "allow-stop-background-sync",
]
